# ============================================================
# OPSYN BACKEND — pyproject.toml
# All Python dependencies with pinned major versions
# ============================================================

[tool.poetry]
name        = "opsyn-backend"
version     = "2.0.0"
description = "Opsyn Operational Intelligence Platform Backend — Powered by SlimTech"
authors     = ["SlimTech Engineering <dev@slimtech.ng>"]
python      = "^3.12"

[tool.poetry.dependencies]
# ── Web framework ─────────────────────────────────────────────
fastapi            = "^0.115"
uvicorn            = {extras = ["standard"], version = "^0.30"}

# ── Database ──────────────────────────────────────────────────
sqlalchemy         = {extras = ["asyncio"], version = "^2.0"}
asyncpg            = "^0.29"
alembic            = "^1.13"

# ── Validation ────────────────────────────────────────────────
pydantic           = "^2.9"
pydantic-settings  = "^2.5"
python-multipart   = "^0.0.9"

# ── Auth & Security ───────────────────────────────────────────
python-jose        = {extras = ["cryptography"], version = "^3.3"}
passlib            = {extras = ["bcrypt"], version = "^1.7"}

# ── Redis & Caching ───────────────────────────────────────────
redis              = {extras = ["asyncio"], version = "^5.0"}
fastapi-limiter    = "^0.1"

# ── Task Queue ────────────────────────────────────────────────
celery             = {extras = ["redis"], version = "^5.4"}

# ── Email ─────────────────────────────────────────────────────
jinja2             = "^3.1"

# ── Logging & Monitoring ──────────────────────────────────────
structlog          = "^24.4"
sentry-sdk         = {extras = ["fastapi"], version = "^2.0"}

[tool.poetry.group.dev.dependencies]
pytest             = "^8.3"
pytest-asyncio     = "^0.23"
httpx              = "^0.27"
factory-boy        = "^3.3"
ruff               = "^0.6"
mypy               = "^1.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false
